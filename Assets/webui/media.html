<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="js/i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>影音 · AhoChat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300a4dc'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/media.css">
<script>
/* 主题：与聊天页共用同一份 MTheme（localStorage 键 mchat_theme），
   统一用 document.documentElement[data-theme] 切换 CSS 变量，dark/light/auto。 */
(function(){var K='mchat_theme';function g(){try{return localStorage.getItem(K)||'auto';}catch(e){return 'auto';}}function sd(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;}function r(t){t=t||g();if(t==='auto')return sd()?'dark':'light';if(t==='night')return 'dark';if(t==='day')return 'light';return t;}function a(t){var x=r(t);document.documentElement.setAttribute('data-theme',x);return x;}window.MTheme={get:g,resolve:r,apply:a,set:function(t){try{localStorage.setItem(K,t);}catch(e){}return a(t);},toggle:function(){var c=r();return this.set(c==='dark'?'light':'dark');}};a();})();
</script>
</head>
<body>

<div id="app">
  <!-- ============ 左侧导航（Jellyfin 风格） ============ -->
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg></div>
      <div class="brand-text"><b>影音</b><span>AhoChat Media</span></div>
      <button id="btnCloseSide" class="icon-btn only-mobile" title="关闭"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-label">媒体库</div>
      <button class="nav-item active" data-view="home"><i><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4.5l8 7V20h-5v-5.5h-6V20H4z"/></svg></i><span>首页</span></button>
      <button class="nav-item" data-view="audio"><i><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="17" r="2.6"/><circle cx="17" cy="15" r="2.6"/><path d="M10.6 17V7.2l9-2v9.8"/></svg></i><span>音乐</span><em id="cntAudio">0</em></button>
      <button class="nav-item" data-view="video"><i><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M10.5 9.5l5 2.5-5 2.5z"/></svg></i><span>视频</span><em id="cntVideo">0</em></button>
      <button class="nav-item" data-view="photo"><i><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M4.5 16.5l4.5-4.5 3.5 3.5 3-3 4.5 4"/><circle cx="9" cy="9.5" r="1.3"/></svg></i><span>图片</span><em id="cntPhoto">0</em></button>
      <button class="nav-item" data-view="favorites"><i><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="currentColor"><path d="M12 20.2C3.4 14.2 3.8 6.2 8.3 6.2c2.1 0 3.1 1.7 3.7 2.9.6-1.2 1.6-2.9 3.7-2.9 4.5 0 4.9 8 .3 14z"/></svg></i><span>我喜欢的</span><em id="cntFav">0</em></button>
      <button class="nav-item" data-view="online"><i><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 17.5a4 4 0 01-.3-8 5.5 5.5 0 0110.6 1.3A3.4 3.4 0 0117 17.5z"/></svg></i><span>网络音乐</span></button>
      <button class="nav-item" data-view="vod"><i><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/></svg></i><span>在线影视</span><em id="cntVod">0</em></button>
      <button class="nav-item" onclick="location.href='/download'"><i><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg></i><span>下载</span></button>
      <div class="nav-label nav-label-row"><span>歌单</span><button id="btnNewList" class="mini-add" title="新建歌单"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div id="playlistNav" class="playlist-nav"></div>
    </nav>

    <div class="side-foot">
      <button id="btnDirs" class="side-btn"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.2v2.4M12 18.4v2.4M3.2 12h2.4M18.4 12h2.4M5.8 5.8l1.7 1.7M16.5 16.5l1.7 1.7M18.2 5.8l-1.7 1.7M7.5 16.5l-1.7 1.7"/></svg> 检索目录</button>
      <button id="btnScan" class="side-btn"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.4 12a7.4 7.4 0 10-2.6 5.6"/><path d="M19.8 6.6v5.2h-5.2"/></svg> 重新扫描</button>
      <div id="sideStats" class="side-stats">正在加载…</div>
      <a class="side-btn link" href="/">← 返回聊天</a>
    </div>
  </aside>

  <!-- ============ 主内容 ============ -->
  <main class="main">
    <header class="topbar">
      <button id="btnOpenSide" class="icon-btn only-mobile" title="导航"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button id="btnTheme" class="icon-btn" title="日间 / 夜间"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 7 7 0 1020 14.5z"/></svg></button>
      <div class="search-wrap">
        <span class="search-ico"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.2"/><path d="M15.4 15.4l4.2 4.2"/></svg></span>
        <input id="search" type="search" placeholder="搜索标题、歌手、专辑或文件名…" autocomplete="off">
        <button id="btnClearSearch" class="clear" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <button id="btnQueueTop" class="icon-btn" title="播放队列"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button id="btnSync" class="pill-btn" title="加入 App 端发起的播放（共享歌单）或一起听（跟随进度）"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0113.7-5.6M20 12a8 8 0 01-13.7 5.6"/><path d="M17.7 3v3.4h-3.4M6.3 21v-3.4h3.4"/></svg><span>共享听</span></button>
    </header>

    <!-- ============ 共享听状态条（加入 App 发起的一起听 / 同步听，资源全部走 App 网关） ============ -->
    <div id="syncBar" class="sync-bar" hidden>
      <div id="syncArt" class="sync-art"><span></span></div>
      <div class="sync-meta">
        <div id="syncTitle">—</div>
        <div id="syncSub">等待 App 发起播放 / 一起听</div>
        <div class="sync-seek"><div id="syncFill"></div></div>
      </div>
      <div class="sync-ctrl">
        <button id="btnSyncPlay" class="ctrl" title="播放/暂停"></button>
        <button id="btnSyncList" class="ghost-btn" hidden title="查看并加入共享歌单">歌单</button>
        <span id="syncTime" class="sync-time">00:00 / 00:00</span>
        <span id="syncBadge" class="sync-badge idle">未开启</span>
      </div>
      <button id="btnSyncClose" class="icon-btn" title="退出共享听"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

      <!-- 一起听：共享歌单（各播各的，可任选曲目；同步听不显示） -->
      <div id="syncListPanel" class="sync-list" hidden>
        <div class="drawer-head"><b>播放 · 共享歌单</b>
          <button id="btnSyncListClose" class="icon-btn" title="关闭"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="sync-list-tip">共享同一歌单、各播各的：点任意曲目独立播放；「跟随发起端」恢复自动切歌。</div>
        <div id="syncListBody" class="drawer-body"></div>
        <div class="sync-list-foot"><button id="btnSyncFollow" class="primary-btn">跟随发起端</button></div>
      </div>
    </div>

    <div id="viewHead" class="view-head">
      <div>
        <h1 id="viewTitle">首页</h1>
        <p id="viewSub">正在加载影音库…</p>
      </div>
      <div class="view-actions">
        <button id="btnVodSettings" class="ghost-btn" hidden><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.2v2.4M12 18.4v2.4M3.2 12h2.4M18.4 12h2.4M5.8 5.8l1.7 1.7M16.5 16.5l1.7 1.7M18.2 5.8l-1.7 1.7M7.5 16.5l-1.7 1.7"/></svg> 设置</button>
        <button id="btnPlayAll" class="primary-btn"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg> 播放全部</button>
        <button id="btnShuffleAll" class="ghost-btn" title="随机播放"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5h3.6l9 9h4.2M3.5 16.5h3.6l9-9h4.2M18 4.8l2.6 2.7L18 10.2M18 13.8l2.6 2.7L18 19.2"/></svg> 随机</button>
      </div>
    </div>

    <section id="content" class="content"></section>

    <!-- 右侧竖向 A-Z 首字母索引（音乐 / 视频列表） -->
    <div id="azIndex" class="az-index" hidden></div>
    <div id="azBubble" class="az-bubble" hidden></div>
  </main>
</div>

<!-- ============ 底部播放条（nowPlayingBar） ============ -->
<footer id="nowbar" class="nowbar">
  <div id="seekWrap" class="now-seek"><div id="seekFill" class="now-seek-fill"></div></div>
  <div class="now-inner">
    <div id="nowArt" class="now-art"><span><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="17" r="2.6"/><circle cx="17" cy="15" r="2.6"/><path d="M10.6 17V7.2l9-2v9.8"/></svg></span></div>
    <div id="nowMeta" class="now-meta" title="点击查看封面与滚动歌词">
      <div id="nowTitle" class="now-title">未在播放</div>
      <div id="nowSub" class="now-sub">选一首歌或一部视频开始</div>
      <div id="nowLyric" class="now-lyric" hidden></div>
    </div>
    <div class="now-center">
      <button id="btnPrev" class="ctrl" title="上一曲"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><rect x="5" y="5" width="2.6" height="14" rx="1"/><path d="M19 5v14l-10-7z"/></svg></button>
      <button id="btnPlay" class="ctrl main-ctrl" title="播放/暂停"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg></button>
      <button id="btnNext" class="ctrl" title="下一曲"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><rect x="16.4" y="5" width="2.6" height="14" rx="1"/><path d="M5 5v14l10-7z"/></svg></button>
      <span id="nowTime" class="now-time">00:00 / 00:00</span>
    </div>
    <div class="now-right">
      <button id="btnFav" class="ctrl small" title="喜欢"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2C3.4 14.2 3.8 6.2 8.3 6.2c2.1 0 3.1 1.7 3.7 2.9.6-1.2 1.6-2.9 3.7-2.9 4.5 0 4.9 8 .3 14z"/></svg></button>
      <button id="btnLyrics" class="ctrl small" title="歌词">词</button>
      <button id="btnRepeat" class="ctrl small" title="循环模式">顺序</button>
      <button id="btnShuffle" class="ctrl small" title="随机"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5h3.6l9 9h4.2M3.5 16.5h3.6l9-9h4.2M18 4.8l2.6 2.7L18 10.2M18 13.8l2.6 2.7L18 19.2"/></svg></button>
      <button id="btnMute" class="ctrl small" title="静音"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L13 5.5v13L7.5 14.5H4z"/><path d="M16.4 9a4 4 0 010 6"/></svg></button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1" class="vol">
      <button id="btnQueue" class="ctrl small" title="播放队列"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
</footer>

<!-- ============ 抽屉 / 弹层 ============ -->
<div id="mask" class="mask" hidden></div>

<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head"><b id="drawerTitle">播放队列</b><button id="btnCloseDrawer" class="icon-btn"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>

<div id="lyricsPanel" class="lyrics-panel" hidden>
  <div class="drawer-head"><b>歌词</b><button id="btnCloseLyrics" class="icon-btn"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="lyricsBody" class="lyrics-body"><p class="empty">暂无歌词</p></div>
</div>

<div id="videoOverlay" class="video-overlay" hidden>
  <video id="videoEl" playsinline preload="auto"></video>

  <!-- 自定义控件层：进入播放默认隐藏，仅点击画面中间唤起（拖拽进度只出时间提示） -->
  <div id="videoCtl" class="video-ctl" hidden>
    <div class="video-top">
      <button id="btnCloseVideo" class="icon-btn" title="关闭"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div id="videoTitle" class="video-title"></div>
      <div id="videoLoading" class="video-loading" hidden><div class="spinner"></div><span>缓冲中…</span></div>
    </div>
    <div class="video-bottom">
      <div id="videoSeekWrap" class="video-seek"><div id="videoSeekFill" class="video-seek-fill"></div></div>
      <div class="video-btn-row">
        <span id="videoTime" class="video-time">00:00 / 00:00</span>
        <button id="btnVideoPlay" class="video-btn">暂停</button>
        <button id="btnVideoShare" class="video-btn">分享</button>
      </div>
    </div>
  </div>

  <!-- 拖拽进度时的时间提示（唯一允许在拖拽时显示的浮层） -->
  <div id="videoHud" class="video-hud" hidden></div>
</div>

<!-- ============ 图片全屏预览：默认无 UI，点正中间展开菜单 ============ -->
<div id="photoOverlay" class="photo-overlay" hidden>
  <img id="photoImg" alt="">
  <div id="photoHint" class="photo-hint" hidden>← 滑动切换 →</div>
  <div id="photoMenu" class="photo-panel" hidden>
    <div id="photoMenuInfo" class="photo-info"></div>
    <div class="photo-actions">
      <button data-act="delete">删除</button>
      <button data-act="share">分享</button>
      <button data-act="rename">重命名</button>
      <button data-act="detail">详情</button>
    </div>
  </div>
  <div id="photoDetail" class="photo-panel photo-detail" hidden>
    <div class="photo-panel-head"><b>详情</b><button id="btnClosePhotoDetail" class="icon-btn"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="d-row"><span>文件名称</span><b id="pdName" class="link-name" title="点击重命名"></b></div>
    <div class="d-row"><span>修改时间</span><b id="pdTime"></b></div>
    <div class="d-row"><span>所在目录</span><b id="pdFolder"></b></div>
    <div class="d-row"><span>大小 / 尺寸</span><b id="pdExtra"></b></div>
    <div class="photo-tip">点击文件名称可直接重命名</div>
  </div>
</div>

<!-- ============ 歌曲详情页（封面 / 信息 / 歌词） ============ -->
<div id="detailOverlay" class="detail-overlay" hidden>
  <div class="detail-card">
    <button id="btnCloseDetail" class="icon-btn detail-close" title="返回"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="detail-layout">
      <!-- 左：封面 + 标题 + 操作 -->
      <div class="detail-left">
        <div class="detail-art">
          <img id="detailArt" alt="">
          <span><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="17" r="2.6"/><circle cx="17" cy="15" r="2.6"/><path d="M10.6 17V7.2l9-2v9.8"/></svg></span>
        </div>
        <div class="detail-meta">
          <div id="detailTitle" class="detail-title"></div>
          <div id="detailSub" class="detail-sub"></div>
        </div>
        <div class="detail-actions">
          <button id="btnDetailPlay" class="primary-btn"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg> 播放</button>
          <button id="btnDetailFav" class="ctrl small" title="喜欢"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2C3.4 14.2 3.8 6.2 8.3 6.2c2.1 0 3.1 1.7 3.7 2.9.6-1.2 1.6-2.9 3.7-2.9 4.5 0 4.9 8 .3 14z"/></svg></button>
        </div>
      </div>
      <!-- 右：歌词 -->
      <div class="detail-right">
        <div class="detail-lyrics-head">歌词</div>
        <div id="detailLyrics" class="detail-lyrics"><p class="empty">暂无歌词</p></div>
      </div>
    </div>
  </div>
</div>

<div id="dialog" class="dialog" hidden>
  <div class="dialog-card">
    <h3 id="dlgTitle">标题</h3>
    <div id="dlgBody"></div>
    <div class="dialog-foot">
      <button id="dlgCancel" class="ghost-btn">取消</button>
      <button id="dlgOk" class="primary-btn">确定</button>
    </div>
  </div>
</div>

<!-- ============ 在线影视详情（海报 / 简介 / 多源 / 线路 / 剧集） ============ -->
<div id="vodOverlay" class="vod-overlay" hidden>
  <div class="vod-card">
    <button id="btnCloseVod" class="icon-btn vod-close" title="关闭"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="vod-head">
      <div class="vod-poster"><img id="vodPoster" alt=""><span><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg></span></div>
      <div class="vod-info">
        <h2 id="vodName"></h2>
        <div id="vodMeta" class="vod-meta"></div>
        <p id="vodDesc" class="vod-desc"></p>
      </div>
    </div>
    <div class="vod-bar">
      <div id="vodVariants" class="vod-chips"></div>
      <button id="btnVodLine" class="ghost-btn"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg> 线路</button>
      <button id="btnVodHistory" class="ghost-btn"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg> 历史</button>
      <button id="btnVodShare" class="ghost-btn" title="同时分享「观看」与「一起看」"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg> 分享</button>
    </div>
    <button id="btnVodDownload" class="ghost-btn" title="下载本集视频（切片合并为 mp4，见「下载」中心）"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/></svg> 下载本集</button>
    <div id="vodEpisodes" class="vod-eps"></div>
  </div>
</div>

<!-- ============ App 端「一起听 / 一起看」自动发现提示（确定加入 / 取消隐藏） ============ -->
<div id="joinBar" class="join-bar" hidden>
  <img id="joinArt" class="join-art" alt="">
  <span class="join-meta">
    <b id="joinText">正在播放…</b>
    <small id="joinSub"></small>
  </span>
  <span class="join-actions">
    <button id="joinCancel" class="ghost-btn">取消</button>
    <button id="joinOk" class="primary-btn">确定</button>
  </span>
</div>

<div id="itemMenu" class="item-menu" hidden></div>
<div id="toast" class="toast" hidden></div>

<audio id="audioEl" preload="metadata"></audio>
<audio id="syncAudio" preload="metadata"></audio>
<!-- 拼音首字母表（A-Z 索引）：必须在 media.js 之前加载 -->
<script src="/js/pinyin.js"></script>
<script src="/js/media.js"></script>
<script src="/js/hls.min.js"></script>
<script src="/js/vod.js"></script>
</body>
</html>
