
<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <link rel="icon" type="image/png" href="assets/images/3dviewer_net_favicon.ico">
    <link rel="canonical" href="https://3dviewer.net">

    <title>Online 3D Viewer</title>

    <meta name="description" content="A free and open source web solution to visualize and explore 3D models right in your browser. Supported file formats: 3dm, 3ds, 3mf, amf, bim, brep, dae, fbx, fcstd, gltf, ifc, iges, step, stl, obj, off, ply, wrl.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Online 3D Viewer">
    <meta property="og:description" content="A free and open source web solution to visualize and explore 3D models right in your browser. Supported file formats: 3dm, 3ds, 3mf, amf, bim, brep, dae, fbx, fcstd, gltf, ifc, iges, step, stl, obj, off, ply, wrl.">
    <meta property="og:image" content="3dviewer_net_logo_social.png">
    <meta property="og:site_name" content="3dviewer.net">
    <meta property="og:url" content="https://3dviewer.net">

    <link rel="stylesheet" type="text/css" href="o3dv.website.min.css?v=0.16.0">
    <script type="text/javascript" src="o3dv.website.min.js?v=0.16.0"></script>
    <script type="text/javascript" src="print3d.js?v=0.16.0"></script>
    <script type="text/javascript">
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6ZZ5ZTMBX5');
      OV.SetWebsiteEventHandler ((eventName, eventLabel, eventParams) => {
        let params = {
          event_label : eventLabel
        };
        if (eventParams !== undefined && eventParams !== null) {
            for (let key in eventParams) {
                if (Object.prototype.hasOwnProperty.call (eventParams, key)) {
                    params[key] = eventParams[key];
                }
            }
        }
        gtag ('event', eventName, params);
      });
    </script>

    <script type="text/javascript">
        OV.StartWebsite ();
    </script>

</head>

<body>
    <input type="file" id="open_file" style="display:none;" multiple></input>
    <div class="header" id="header">
        <div class="title" style="display:none;">
            <div class="title_left">
                <a href="index.html">
                    <svg class="logo_image"><use href="3dviewer_net_logo_text.svg#logo"></use></svg>
                </a>
            </div>
            <div class="title_right" id="header_buttons"></div>
            <div class="main_file_name only_full_width" id="main_file_name"></div>
        </div>
        <div class="toolbar" id="toolbar"></div>
    </div>
    <div class="main" id="main">
        <div class="main_left_container only_full_width" id="main_left_container" style="display:none;">
            <div class="main_navigator ov_panel_set_container" id="main_navigator"></div>
            <div class="main_splitter" id="main_navigator_splitter"></div>
        </div>
        <div class="main_viewer" id="main_viewer"></div>
        <div class="main_right_container only_full_width" id="main_right_container" style="display:none;">
            <div class="main_splitter" id="main_sidebar_splitter"></div>
            <div class="main_sidebar ov_panel_set_right_container" id="main_sidebar"></div>
        </div>
    </div>
    <div class="intro ov_thin_scrollbar" id="intro">
        <div class="intro_content" id="intro_content">
            <div class="intro_logo">
                <a href="https://3dviewer.net/index.html"><svg class="intro_logo"><use href="3dviewer_net_logo_text.svg#logo"></use></svg></a>
                <div class="intro_dragdrop_text" id="intro_dragdrop_text"></div>
            </div>
            <div class="intro_formats">
                <div class="intro_formats_title" id="intro_formats_title"></div>
                <div class="intro_file_formats">
                    <a>3dm</a>
                    <a>3ds</a>
                    <a>3mf</a>
                    <a>amf</a>
                    <a>bim</a>
                    <a>brep</a>
                    <a>dae</a>
                    <a>fbx</a>
                    <a>fcstd</a>
                    <a>gltf</a>
                    <a>ifc</a>
                    <a>iges</a>
                    <a>step</a>
                    <a>stl</a>
                    <a>obj</a>
                    <a>off</a>
                    <a>ply</a>
                    <a>wrl</a>
                </div>
            </div>
            <div class="only_full_width" style="width:780px;margin-left:-140px;margin-top:50px;">
            <!-- Intro footer ad -->
            <ins class="adsbygoogle"
                 style="display:inline-block;width:780px;height:100px"
                 data-ad-client="ca-pub-2841513414125344"
                 data-ad-slot="9668360357"></ins>
            </div>
        </div>
    </div>
</body>

</html>
