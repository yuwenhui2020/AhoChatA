<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="../js/i18n.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>视频播放</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e8eaed;
    font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  #bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex: 0 0 auto;
    background: #14181d; border-bottom: 1px solid #222831; }
  #name { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis; color: #cdd6e6; }
  #bar button, #bar a { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid #2b3d55; background: #16202c; color: #cdd6e6; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
    padding: 0; font: inherit; }
  #bar button:hover, #bar a:hover { background: #1d2a3a; color: #fff; }
  #bar svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  #bar button.on { color: #6cb6ff; border-color: #3a567d; }
  #speed { font-size: 12px; font-variant-numeric: tabular-nums; }

  #wrap { flex: 1; position: relative; background: #000; min-height: 0; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000;
    object-fit: contain; }
  #msg { position: absolute; inset: 0; display: none; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    color: #9aa4b2; font-size: 13px; background: rgba(11,13,16,.9); white-space: pre-line; }
  #msg.show { display: flex; }
  #msg .big { color: #e8eaed; font-size: 15px; font-weight: 600; }
  #msg a, #msg button { font: inherit; font-size: 13px; color: #6cb6ff; cursor: pointer;
    background: #16202c; border: 1px solid #2b3d55; border-radius: 8px; padding: 8px 14px;
    text-decoration: none; }
  #spin { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #2b3d55;
    border-top-color: #6cb6ff; animation: sp .9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #6b7480;
    pointer-events: none; }
  @media (max-width: 520px) { #hint { display: none; } #bar { padding: 6px 8px; gap: 6px; } }
</style>
</head>
<body>
<div id="bar">
  <span id="name">视频</span>
  <button id="bSpeed" title="播放速度"><span id="speed">1×</span></button>
  <button id="bRotate" title="旋转 90°">
    <svg viewBox="0 0 24 24"><path d="M4 8a8 8 0 1114 5"/><path d="M4 3.5V8h4.5"/></svg>
  </button>
  <button id="bPip" title="画中画">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><rect x="12" y="11.5" width="7" height="6" rx="1.4"/></svg>
  </button>
  <button id="bFull" title="全屏">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="bReload" title="重新加载">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 10-2.8 6.1"/><path d="M20.4 5.6v6h-6"/></svg>
  </button>
  <a id="dl" href="#" download title="下载">
    <svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
  </a>
</div>

<div id="wrap">
  <video id="v" playsinline webkit-playsinline preload="metadata" controls autoplay></video>
  <div id="msg"></div>
  <div id="hint">空格 播放/暂停 · ←/→ 快退快进 · F 全屏 · M 静音</div>
</div>

<script>
(function () {
  "use strict";

  var v = document.getElementById("v");
  var msgEl = document.getElementById("msg");
  var nameEl = document.getElementById("name");

  function qp(n) {
    var s = (location.search || "").replace(/^\?/, "");
    var arr = s ? s.split("&") : [];
    for (var i = 0; i < arr.length; i++) {
      var k = arr[i].split("=");
      if (decodeURIComponent(k[0]) === n) return decodeURIComponent((k[1] || "").replace(/\+/g, " "));
    }
    return "";
  }

  var file = qp("file");
  var name = qp("name") || (file ? decodeURIComponent(file.split("?")[0].split("/").pop() || "") : "");
  if (name) { nameEl.textContent = name; document.title = name; }

  /* 被预览页 iframe 嵌套时，外层已经有「文件名 + 下载」了，这里不再重复一条顶栏，
     把整块高度都让给画面。单独打开本页（新窗口）时才显示工具栏。 */
  var embedded = false;
  try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
  if (embedded) document.getElementById("bar").style.display = "none";

  function showMsg(title, hint, buttons, spinner) {
    msgEl.innerHTML = "";
    msgEl.className = "show";
    if (spinner) {
      var sp = document.createElement("div"); sp.id = "spin"; msgEl.appendChild(sp);
    }
    if (title) { var t = document.createElement("div"); t.className = "big"; t.textContent = title; msgEl.appendChild(t); }
    if (hint) { var h = document.createElement("div"); h.textContent = hint; msgEl.appendChild(h); }
    (buttons || []).forEach(function (b) {
      var el = document.createElement(b.href ? "a" : "button");
      el.textContent = b.text;
      if (b.href) { el.href = b.href; el.target = "_blank"; el.rel = "noopener"; }
      if (b.onClick) el.onclick = b.onClick;
      msgEl.appendChild(el);
    });
  }
  function hideMsg() { msgEl.className = ""; msgEl.innerHTML = ""; }

  if (!file) {
    showMsg("没有视频地址", "请从文件共享页点「预览」进入。", [{ text: "打开文件共享", href: "/file" }]);
    return;
  }

  var dl = document.getElementById("dl");
  dl.href = file;

  /* 常见但浏览器解不了的封装格式：给出明确提示，别让人对着黑屏猜 */
  var ext = (name.split(".").pop() || "").toLowerCase();
  var BAD = { mkv: 1, avi: 1, rmvb: 1, rm: 1, flv: 1, wmv: 1, mpg: 1, mpeg: 1 };
  var BAD_TIP = {
    mkv: "MKV 浏览器通常解不了；若是 H.264 + AAC，把文件改成 .mp4 后缀多半就能直接播。",
    mov: "MOV 视编码而定，H.264 + AAC 的可以播，ProRes 之类需要本地播放器。",
    avi: "AVI 里的编码浏览器基本不支持，请用本地播放器。",
    flv: "FLV 请用本地播放器或转成 mp4。",
    rmvb: "RMVB 请用本地播放器。",
    rm: "RM 请用本地播放器。",
    wmv: "WMV 请用本地播放器。",
    mpg: "MPG/MPEG-2 浏览器基本不支持，请用本地播放器。",
    mpeg: "MPG/MPEG-2 浏览器基本不支持，请用本地播放器。"
  };

  showMsg("正在加载…", "", null, true);

  v.src = file;
  v.load();

  var gotData = false;

  v.addEventListener("loadedmetadata", function () { gotData = true; });
  v.addEventListener("canplay", function () { gotData = true; hideMsg(); });
  v.addEventListener("playing", function () { gotData = true; hideMsg(); });
  v.addEventListener("waiting", function () { if (gotData) showMsg("缓冲中…", "", null, true); });

  v.addEventListener("error", function () {
    var code = v.error ? v.error.code : 0;
    var tip = {
      1: "加载被中断。",
      2: "网络错误，文件可能已被移动或删除。",
      3: "解码失败 —— 浏览器不支持这种视频编码。",
      4: "格式不受支持。"
    }[code] || "";
    var extra = BAD_TIP[ext] ? "\n\n" + BAD_TIP[ext] : "";
    showMsg("这个视频播不了",
      (tip ? tip + "\n" : "") + "文件：" + name + extra,
      [
        { text: "下载到本地", href: file },
        { text: "重新加载", onClick: function () { location.reload(); } }
      ]);
  });

  /* 15 秒还没任何元数据 → 提示（而不是一直转圈） */
  setTimeout(function () {
    if (gotData) return;
    if (v.readyState === 0) {
      showMsg("长时间没有响应",
        "文件可能较大或网络较慢。可以点「下载到本地」用本地播放器打开。\n文件：" + name,
        [
          { text: "下载到本地", href: file },
          { text: "重新加载", onClick: function () { location.reload(); } }
        ]);
    }
  }, 15000);

  /* ---------------- 工具按钮 ---------------- */
  var rates = [1, 1.25, 1.5, 2, 0.75, 0.5];
  var ri = 0;
  var speedEl = document.getElementById("speed");
  document.getElementById("bSpeed").onclick = function () {
    ri = (ri + 1) % rates.length;
    v.playbackRate = rates[ri];
    speedEl.textContent = rates[ri] + "×";
    this.classList.toggle("on", rates[ri] !== 1);
  };

  var rot = 0;
  document.getElementById("bRotate").onclick = function () {
    rot = (rot + 90) % 360;
    v.style.transform = "rotate(" + rot + "deg)";
    this.classList.toggle("on", rot !== 0);
  };

  document.getElementById("bPip").onclick = function () {
    try {
      if (document.pictureInPictureElement) document.exitPictureInPicture();
      else if (v.requestPictureInPicture) v.requestPictureInPicture();
      else alert("当前浏览器不支持画中画");
    } catch (e) { alert("当前浏览器不支持画中画"); }
  };

  var wrap = document.getElementById("wrap");
  document.getElementById("bFull").onclick = function () {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else if (wrap.requestFullscreen) wrap.requestFullscreen();
      else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
      else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();   // iOS Safari
      else alert("当前浏览器不支持全屏");
    } catch (e) { }
  };

  document.getElementById("bReload").onclick = function () { location.reload(); };

  wrap.addEventListener("dblclick", function (e) {
    if (e.target === v) document.getElementById("bFull").click();
  });

  /* 键盘快捷键（预览 iframe 内也可用） */
  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === " " || k === "Spacebar") { e.preventDefault(); if (v.paused) v.play(); else v.pause(); }
    else if (k === "ArrowRight") v.currentTime = Math.min(v.duration || 1e9, v.currentTime + 5);
    else if (k === "ArrowLeft") v.currentTime = Math.max(0, v.currentTime - 5);
    else if (k === "ArrowUp") { e.preventDefault(); v.volume = Math.min(1, v.volume + 0.1); }
    else if (k === "ArrowDown") { e.preventDefault(); v.volume = Math.max(0, v.volume - 0.1); }
    else if (k === "f" || k === "F") document.getElementById("bFull").click();
    else if (k === "m" || k === "M") v.muted = !v.muted;
    else if (k === "r" || k === "R") location.reload();
  });

  /* 自动播放被拦时由原生 controls 兜住，不另做遮罩 */
  try { var p = v.play(); if (p && p.catch) p.catch(function () { }); } catch (e) { }
})();
</script>
</body>
</html>
