<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
    <script src="js/i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>设置 · 自动接收文件</title>
<link rel="stylesheet" href="css/app.css">
<style>
  html, body { margin:0; background:var(--bg,#f4f6fa); font-family:-apple-system,"Microsoft YaHei",sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:14px; }
  .card { background:var(--card,#fff); border-radius:14px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:14px; }
  .card h2 { font-size:16px; margin:0 0 12px; color:var(--fg,#222); }
  .row { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid rgba(0,0,0,.05); }
  .row:first-of-type { border-top:0; }
  .row label { flex:0 0 84px; color:var(--muted,#667); font-size:13px; }
  .row .grow { flex:1; color:var(--fg,#333); font-size:13px; }
  input[type=text] { width:100%; padding:9px 10px; border:1px solid #d7dce5; border-radius:8px; font-size:13px; box-sizing:border-box; background:var(--card,#fff); color:var(--fg,#333); }
  button { padding:9px 14px; border:0; border-radius:8px; background:#2f7de0; color:#fff; font-size:13px; cursor:pointer; }
  button.ghost { background:var(--chip,#e8ecf3); color:var(--fg,#333); }
  .switch { width:46px; height:26px; border-radius:13px; background:#c9cfd9; position:relative; cursor:pointer; transition:background .2s; }
  .switch.on { background:#1fbf6b; }
  .switch i { position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s; }
  .switch.on i { left:23px; }
  .hint { color:var(--muted,#98a); font-size:12px; line-height:1.6; margin-top:8px; }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:rgba(0,0,0,.82); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99; }
  .toast.show { opacity:1; }
  .back { color:#2f7de0; text-decoration:none; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
    <h2 style="margin:0;font-size:18px;color:var(--fg,#222);">设置</h2>
    <a class="back" href="/">返回首页</a>
  </div>

  <div class="card">
    <h2>自动接收局域网文件</h2>
    <div class="row">
      <label>自动接收</label>
      <div class="grow">收到任意文件后自动保存</div>
      <div id="arSwitch" class="switch"><i></i></div>
    </div>
    <div class="row">
      <label>保存目录</label>
      <input id="arDir" class="grow" type="text" placeholder="留空使用默认目录">
    </div>
    <div class="row">
      <label></label>
      <button id="arSave">保存设置</button>
      <button id="arDefault" class="ghost">用默认目录</button>
    </div>
    <div class="row">
      <label>存储权限</label>
      <button id="arPerm" class="ghost">申请所有文件访问权限</button>
    </div>
    <div id="arHint" class="hint">默认直接保存到公共下载目录（/sdcard/Download）。若自定义到其它公共目录，需先点"申请所有文件访问权限"并允许。同名文件自动加序号，不覆盖。</div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="js/settings.js"></script>
</body>
</html>
