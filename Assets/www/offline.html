<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="js/i18n.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>离线 - Mchat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .offline-container {
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }
        .offline-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0062cc;
        }
        .offline-tips {
            margin-top: 32px;
            padding: 16px;
            background: #f5f5f5;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            color: #666;
        }
        .offline-tips h3 {
            margin-bottom: 8px;
            color: #333;
        }
        .offline-tips ul {
            padding-left: 20px;
            margin: 0;
        }
        .offline-tips li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>当前处于离线状态</h1>
        <p>网络连接不可用，无法加载页面内容。</p>
        
        <a href="/" class="btn" onclick="window.location.reload()">重新加载</a>
        
        <div class="offline-tips">
            <h3>离线模式下可用功能：</h3>
            <ul>
                <li>查看已缓存的聊天记录</li>
                <li>查看已缓存的图片和文件</li>
                <li>使用本地文件管理功能</li>
            </ul>
            <h3 style="margin-top: 16px;">恢复连接后：</h3>
            <ul>
                <li>页面将自动刷新</li>
                <li>新消息将自动同步</li>
                <li>离线期间的操作将同步上传</li>
            </ul>
        </div>
    </div>
    
    <script>
        // 检测在线状态
        function updateOnlineStatus() {
            if (navigator.onLine) {
                document.body.innerHTML = '<div style="padding: 40px; text-align: center; font-family: system-ui;">网络已恢复，<a href="/" style="color: #007aff;">刷新页面</a></div>';
            }
        }
        
        window.addEventListener('online', updateOnlineStatus);
        
        // 定期检查在线状态
        setInterval(function() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
        
        // 注册 Service Worker 更新监听
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                window.location.reload();
            });
        }
    </script>
</body>
</html>
